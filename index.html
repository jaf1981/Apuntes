<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1e22">
<meta name="apuntes-version" content="21/08 16:02">
<title>Apuntes</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #14161a; color: #e9e4d8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: max(env(safe-area-inset-top), 24px) 24px 24px; text-align: center;
  }
  .caja { max-width: 420px; }
  .ico { font-size: 54px; line-height: 1; }
  h1 { font-size: 22px; font-weight: 800; margin: 18px 0 10px; }
  p { font-size: 16px; line-height: 1.5; opacity: .8; margin: 0 0 10px; }
  .chico { font-size: 13px; opacity: .55; margin-top: 22px; }
</style>
</head>
<body>
  <div class="caja">
    <div class="ico">🛠️</div>
    <h1>Estamos con problemas de servidor</h1>
    <p>La aplicación no está disponible en este momento.</p>
    <p>Disculpá las molestias. Volvé a intentar más tarde.</p>
    <p class="chico">Tu progreso está guardado en este teléfono y no se pierde.</p>
  </div>

<script>
/* Baja de servicio (21/08). Esta pagina reemplaza a la app y ADEMAS la desmonta
   del telefono: borra los caches del service worker y lo desregistra, para que
   el equipo deje de servir la copia guardada y no se pueda seguir usando sin
   conexion.

   NO se toca localStorage a proposito: ahi vive el progreso de cada chico. Si
   se borrara, se perderia para siempre el estudio de todos por el problema de
   uno, y no habria forma de recuperarlo. Sin la app, esos datos quedan inertes;
   el dia que se vuelva a publicar, cada uno se reencuentra su progreso. */
(function () {
  /* Aviso al buzon de que ESTE equipo ya bajo la version de mantenimiento.
     Sin esto la planilla simplemente se queda muda y no hay forma de saber
     quien la agarro y quien sigue con la app vieja. Usa el mismo id de
     dispositivo y el mismo apodo que ya existian; no agrega ningun dato nuevo. */
  try {
    var URL_BUZON = "https://script.google.com/macros/s/AKfycbxEVmpEToGz7QSHqdpAckNEbtoh5-t1tuwNjavRi1rTCPq6WSfWOPxn9Qa0cOi8H8AB/exec";
    var id = "";
    try { id = localStorage.getItem('apuntes_device') || ""; } catch (e) {}
    var ap = "";
    try { ap = localStorage.getItem('apuntes_apodo') || ""; } catch (e) {}
    var cuerpo = JSON.stringify({ ev: 'baja', device: id, apodo: ap,
                                  ver: '21/08 16:02', detalle: 'mantenimiento recibido' });
    var ok = false;
    try { ok = !!(navigator.sendBeacon && navigator.sendBeacon(URL_BUZON, cuerpo)); } catch (e) {}
    if (!ok) {
      try {
        fetch(URL_BUZON, { method: 'POST', mode: 'no-cors',
                           headers: { 'Content-Type': 'text/plain' }, body: cuerpo });
      } catch (e) {}
    }
  } catch (e) {}

  try {
    if (window.caches && caches.keys) {
      caches.keys().then(function (ks) {
        return Promise.all(ks.map(function (k) { return caches.delete(k); }));
      }).catch(function () {});
    }
  } catch (e) {}
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { try { r.unregister(); } catch (e) {} });
      }).catch(function () {});
    }
  } catch (e) {}
})();
</script>
</body>
</html>
