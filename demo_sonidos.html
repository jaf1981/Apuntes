<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elegí los sonidos — Apuntes</title>
<style>
  body { font-family: Georgia, serif; background:#fffdf6; color:#2b2b25; max-width:480px; margin:30px auto; padding:0 16px; }
  h1 { font-size:22px; } h2 { font-size:17px; margin:22px 0 8px; }
  p { font-size:14px; opacity:.75; }
  button { display:block; width:100%; padding:14px; margin:8px 0; border-radius:12px; border:1px solid rgba(0,0,0,.12);
           background:#fff; color:#2b2b25; font-size:16px; font-family:inherit; cursor:pointer; text-align:left; }
  button:active { transform:scale(.98); }
  .ok { border-left:5px solid #3d5a3d; } .err { border-left:5px solid #8a6d3b; } .extra { border-left:5px solid #5a3d5a; }
</style>
</head>
<body>
<h1>🔊 Elegí los sonidos de la app</h1>
<p>Toquen cada botón y anoten sus favoritos: uno de acierto y uno de error. (Si no suena, subí el volumen y verificá que el iPhone no esté en silencio.)</p>

<h2>✅ Para los ACIERTOS</h2>
<button class="ok" onclick="acierto1()">Acierto 1 — "Ding" brillante</button>
<button class="ok" onclick="acierto2()">Acierto 2 — Arpegio ganador</button>
<button class="ok" onclick="acierto3()">Acierto 3 — "Pop" saltarín</button>

<h2>❌ Para los ERRORES (simpáticos, no agresivos)</h2>
<button class="err" onclick="error1()">Error 1 — "Boop" suave</button>
<button class="err" onclick="error2()">Error 2 — "Uh-oh" caricaturesco</button>
<button class="err" onclick="error3()">Error 3 — Burbuja que se hunde</button>

<h2>🎉 Bonus (para rachas y logros)</h2>
<button class="extra" onclick="fanfarria()">Fanfarria de racha (5 seguidas)</button>
<button class="extra" onclick="campanita()">Campanita de logro</button>

<script>
let ctx;
function ac() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); return ctx; }

/* nota: freq en Hz, t0 offset seg, dur seg, tipo de onda, volumen */
function nota(freq, t0, dur, tipo, vol, bend) {
  const c = ac(), o = c.createOscillator(), g = c.createGain();
  o.type = tipo || 'sine';
  const t = c.currentTime + (t0 || 0);
  o.frequency.setValueAtTime(freq, t);
  if (bend) o.frequency.exponentialRampToValueAtTime(bend, t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol || 0.18, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}

function acierto1() { nota(1046.5, 0, .16, 'sine', .2); nota(1318.5, .07, .22, 'sine', .18); }
function acierto2() { nota(523.25, 0, .12, 'triangle', .2); nota(659.25, .07, .12, 'triangle', .2); nota(783.99, .14, .12, 'triangle', .2); nota(1046.5, .21, .3, 'triangle', .22); }
function acierto3() { nota(783.99, 0, .09, 'square', .07); nota(1174.7, .09, .18, 'square', .07); }
function error1()   { nota(329.63, 0, .18, 'sine', .16); nota(261.63, .14, .3, 'sine', .14); }
function error2()   { nota(293.66, 0, .16, 'triangle', .16); nota(220, .18, .34, 'triangle', .15, 196); }
function error3()   { nota(300, 0, .45, 'sine', .16, 130); }
function fanfarria(){ nota(523.25,0,.1,'triangle',.18); nota(659.25,.08,.1,'triangle',.18); nota(783.99,.16,.1,'triangle',.18); nota(1046.5,.24,.16,'triangle',.2); nota(1318.5,.32,.4,'triangle',.2); }
function campanita(){ nota(1567.98, 0, .5, 'sine', .14); nota(2093, .0, .5, 'sine', .07); }
</script>
</body>
</html>
